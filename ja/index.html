<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🇯🇵 Gimmangi 運命研究所</title>
  <meta name="description" content="幸運易日進・紫微易日進。" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans", "Noto Sans KR", "Noto Sans JP", "Noto Sans Devanagari", sans-serif; }
    body {
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 30px 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.4;
    }
    .card-list { display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: #fff;
      border: 1px solid #eaeaea;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .card-tag {
      font-size: 11px;
      font-weight: 600;
      color: #007aff;
      background: #eef5ff;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .card h3 { font-size: 18px; font-weight: 600; color: #222; margin-bottom: 6px; }
    .card p { font-size: 13px; color: #666; margin-bottom: 15px; line-height: 1.4; }
    .btn {
      display: block;
      width: 100%;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .footer { margin-top: 30px; font-size: 11px; color: #999; line-height: 1.3; }

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><span aria-hidden="true">🇯🇵</span> Gimmangi 運命研究所</h1>
      <p>幸運易日進・紫微易日進。</p>
    </div>

    <div class="card-list">
      <div class="card">
        <span class="card-tag">若年・デイリー</span>
        <h3>幸運易日進 (Lucky Fortune)</h3>
        <p>天・地・人で今日の流れを見るデイリー占いです。</p>
        <a href="https://kmgg5694.github.io/lucky-8/?lang=ja" class="btn">幸運易日進を開く</a>
      </div>

      <div class="card">
        <span class="card-tag">人生・深い分析</span>
        <h3>紫微易日進 (Jami Fortune)</h3>
        <p>本卦・変卦で一日の気を深く見ます。</p>
        <a href="https://kmgg5694.github.io/app_iljin/?lang=ja" class="btn">紫微易日進を開く</a>
      </div>
    </div>

    <div class="footer">
      易経に基づくシステム。<br />© Gimmangi Fortune Institute.
    </div>
  </div>
</body>
</html>
