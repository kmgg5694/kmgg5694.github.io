<!DOCTYPE html>
<html lang="ko">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans", "Noto Sans KR", "Noto Sans JP", "Noto Sans Devanagari", sans-serif; }
    body {
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 30px 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.4;
    }
    .card-list { display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: #fff;
      border: 1px solid #eaeaea;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .card-tag {
      font-size: 11px;
      font-weight: 600;
      color: #007aff;
      background: #eef5ff;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .card h3 { font-size: 18px; font-weight: 600; color: #222; margin-bottom: 6px; }
    .card p { font-size: 13px; color: #666; margin-bottom: 15px; line-height: 1.4; }
    .btn {
      display: block;
      width: 100%;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .footer { margin-top: 30px; font-size: 11px; color: #999; line-height: 1.3; }

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><span aria-hidden="true">🇰🇷</span> 김만기 이름연구소</h1>
      <p>행운역일진, 자미역일진을 모아 둔 페이지입니다.</p>
    </div>

    <div class="card-list">
      <div class="card">
        <span class="card-tag">30대 이하 · 데일리</span>
        <h3>행운역일진</h3>
        <p>천·지·인으로 오늘의 흐름을 짚는 일진 운세입니다.</p>
        <a href="https://kmgg5694.github.io/lucky-8/?lang=ko" class="btn">행운역일진 열기</a>
      </div>

      <div class="card">
        <span class="card-tag">50대 이후 · 심층</span>
        <h3>자미역일진</h3>
        <p>본괘·변괘로 하루 기운을 살펴봅니다.</p>
        <a href="https://kmgg5694.github.io/app_iljin/?lang=ko" class="btn">자미역일진 열기</a>
      </div>
    </div>

    <div class="footer">
      주역 성명학 · 일진 시스템.<br />© 김만기 이름연구소.
    </div>
  </div>
</body>
</html>
