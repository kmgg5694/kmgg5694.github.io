function hoek(ch){const c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return 0;

function run(){
 const F=document.getElementById('f').value.trim();

 const L=document.getElementById('l').value.trim();
 if(!F||!L){document.getElementById('out').innerHTML='<div class="card warn">First와 Last는 필수입니다.</div>';return;}
 const hF=hangulize(F,PICKS.f),hM=M?hangulize(M,PICKS.m):'',hL=hangulize(L,PICKS.l);
 const sF=hsum(hF),sM=hM?hsum(hM):0,sL=hsum(hL);
 const Mv=sM>0?sM:sF;
 const won=sa(sF+Mv),hyeong=sa(sL+sF),i_=sa(sL+Mv),jeong=sa(sL+sF+Mv);
 const S=be(hyeong),g=l=>GWE64[(S-1)*8+l-1];
 const rows=[['원 (元)',won,8,be(won),g(be(won))],['이 (利)',i_,8,be(i_),g(be(i_))],
             ['정 (貞)',jeong,8,be(jeong),g(be(jeong))],['정 (貞)',jeong,6,yuk(jeong),g(yuk(jeong))]];
 let o=`<div class="card"><h3>1. 한글 표기 · 획수</h3>`;
 o+=`<div class="han">${F} → ${hF} (${sF}획)</div>${tbl(hF)}`;
 if(hM)o+=`<div class="han" style="margin-top:12px">${M} → ${hM} (${sM}획)</div>${tbl(hM)}`;
 o+=`<div class="han" style="margin-top:12px">${L} → ${hL} (${sL}획)</div>${tbl(hL)}`;
 if(!hM)o+=`<div class="warn">미들네임이 없어 First 획수(${sF})를 대신 사용합니다.</div>`;
 o+=`</div><div class="card"><h3>2. 수리 4격</h3><table>
 <tr><th>격</th><th>계산</th><th>값</th></tr>
 <tr><td>원 (元)</td><td>First ${sF} + Middle ${Mv}</td><td class="big">${won}</td></tr>
 <tr><td>형 (亨)</td><td>Last ${sL} + First ${sF}</td><td class="big">${hyeong}</td></tr>
 <tr><td>이 (利)</td><td>Last ${sL} + Middle ${Mv}</td><td class="big">${i_}</td></tr>
 <tr><td>정 (貞)</td><td>${sL}+${sF}+${Mv} 총합</td><td class="big">${jeong}</td></tr></table>
 <div class="step">※ 81을 넘으면 81로 나눈 나머지</div></div>`;
 o+=`<div class="card"><h3>3. 상괘 (上卦)</h3>
 <div class="step">형(亨) ${hyeong} ÷ 8 = 나머지 <b>${S}</b></div>
 <div class="big">${PAL[S]}</div></div>`;
 o+=`<div class="card"><h3>4. 주역 4괘</h3><table>
 <tr><th>격</th><th>수</th><th>÷</th><th>나머지</th><th>하괘</th><th>괘명</th></tr>`;
 rows.forEach(r=>{o+=`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><b>${r[3]}</b></td><td>${PAL[r[3]]}</td><td class="gwe">${r[4]}</td></tr>`;});
 o+=`</table><div class="step">※ 정(貞)은 8로 한 번, 6으로 한 번 — 두 번 계산</div></div>`;
 const yy=document.getElementById('yy').value,mm=document.getElementById('mm').value,dd=document.getElementById('dd').value;
 if(yy&&mm&&dd){
  const ys=String(parseInt(yy)).split('').reduce((a,b)=>a+parseInt(b),0);
  const bw=sa(parseInt(mm)+parseInt(dd)),bh=sa(ys+parseInt(mm)),bi=sa(ys+parseInt(dd)),bj=sa(ys+parseInt(mm)+parseInt(dd));
  const BS=be(bh),bg=l=>GWE64[(BS-1)*8+l-1];
  o+=`<div class="card"><h3>5. 탄생일 원형이정 (元亨利貞)</h3>
  <div class="step">연도 ${yy} 각 자리 합 = ${ys} / 월 ${mm} / 일 ${dd}</div><table>
  <tr><th>격</th><th>계산</th><th>값</th><th>괘</th></tr>
  <tr><td>원</td><td>월+일</td><td class="big">${bw}</td><td class="gwe">${bg(be(bw))}</td></tr>
  <tr><td>형</td><td>연합+월</td><td class="big">${bh}</td><td>상괘 ${PAL[BS]}</td></tr>
  <tr><td>이</td><td>연합+일</td><td class="big">${bi}</td><td class="gwe">${bg(be(bi))}</td></tr>
  <tr><td>정</td><td>연합+월+일</td><td class="big">${bj}</td><td class="gwe">${bg(be(bj))} / ${bg(yuk(bj))}</td></tr>
  </table></div>`;
 }
 document.getElementById('out').innerHTML=o;
}
window.addEventListener('DOMContentLoaded',()=>{showVars();run();});
</script></body></html>
